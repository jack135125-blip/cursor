<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교육과정 편성표 확인 프로그램</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>교육과정 편성표 확인 프로그램</h1>
      <div class="lead">
        <p>
          <strong class="em">교육청에서 제공한 엑셀 파일</strong>에 작성된 편성표를 점검합니다.
          파일을 <strong class="em">저장하고 닫은 후에</strong> 업로드하세요.
        </p>
        <a
          class="btn btn-secondary"
          href="{{ template_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >편성표 양식 다운로드</a>
      </div>
      <p class="muted">
        프로그램이 잘못 판단할 수 있으니, 확인했을 때 이상이 없다면 오류를 무시하셔도 됩니다.
      </p>
    </header>

    <section class="card upload-card">
      <div class="file-row">
        <span class="label">엑셀 파일:</span>
        <span id="fileName" class="file-name">선택된 파일 없음</span>
      </div>

      <div class="actions">
        <label class="btn btn-primary" for="fileInput">파일 선택</label>
        <input
          id="fileInput"
          type="file"
          accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12"
          hidden
        />
        <button id="runBtn" class="btn btn-primary" type="button" disabled>검사 실행</button>
      </div>

      <div class="status-row">
        <span id="statusText" class="muted">대기 중</span>
        <div id="progress" class="progress" hidden>
          <div class="progress-bar"></div>
        </div>
      </div>
    </section>

    <section class="card result-card">
      <h2 class="section-title">문제상황(시트별)</h2>
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="panels" class="panels"></div>
      <p id="emptyHint" class="empty-hint muted">검사 실행 후 결과가 여기에 표시됩니다.</p>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
